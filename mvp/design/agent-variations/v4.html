<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent · 4 Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* 4 · Pipeline: every page's stage at a glance, left to right: needs facts, ready, scheduled, live. */
main{max-width:none}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:10px}
.tabs a{padding:7px 14px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
.tabs a[aria-current]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(11,27,53,.1)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;align-items:start;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:14px;padding:12px;min-height:420px}
.col header{display:flex;align-items:center;gap:8px;padding:4px 4px 12px}
.col header h2{font-size:14.5px;margin:0;color:var(--ink)}
.col header span{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}
.col header .dot{width:9px;height:9px;border-radius:50%}
.col .hint{font-size:12.5px;color:var(--muted);margin:-6px 4px 12px}
.tile{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s,transform .15s;cursor:grab}
.tile:hover{border-color:var(--ink);box-shadow:var(--shadow)}
.tile[aria-current]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tile .top{display:flex;gap:10px;align-items:flex-start}
.tile .thumb{width:38px;height:38px}
.tile strong{display:block;font-size:14px;line-height:1.35;color:var(--ink)}
.tile .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.tile .gapbar{display:flex;gap:3px;margin-top:10px}
.tile .gapbar i{flex:1;height:4px;border-radius:2px;background:var(--warn)}
.tile .gapbar i.ok{background:var(--line-2)}
.addcol{border:1px dashed var(--line-2);border-radius:12px;padding:14px;color:var(--muted);font-size:13.5px;text-align:center}
/* draft as a sheet over the board */
.sheet-wrap{display:grid;grid-template-columns:minmax(0,1fr) min(620px,52%);gap:18px;align-items:start}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);position:sticky;top:60px;max-height:calc(100vh - 80px);overflow:auto}
.sheet header{padding:20px 22px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.sheet header h2{font-size:19px;line-height:1.3;margin:8px 0 4px;color:var(--ink)}
.sheet .stage{display:flex;gap:4px;margin-top:12px}
.sheet .stage span{flex:1;font-size:11.5px;font-weight:700;text-align:center;padding:5px 0;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.sheet .stage span.on{background:var(--ink);color:var(--surface)}
.sheet .stage span.past{background:var(--ok-soft);color:var(--ok)}
.sheet .body{padding:18px 22px}
.sheet h3{font-size:13px;color:var(--muted);margin:16px 0 8px}
.sheet .ba{display:grid;gap:10px}
.sheet .before{padding:12px 14px;border-radius:10px;background:var(--surface-2);font-size:14px;color:var(--muted)}
.sheet .facts{display:grid;gap:10px}
.sheet .facts label{font-size:13.5px;font-weight:600;color:var(--ink);display:block;margin-bottom:4px}
.sheet footer{display:flex;gap:8px;padding:14px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.sheet footer .grow{flex:1}
.board-mini .col{min-height:auto}
.sheet-wrap>:first-child{min-width:0;overflow-x:auto}
.board-mini{grid-template-columns:repeat(4,210px)}
.sheet-wrap .week{grid-template-columns:repeat(7,150px)}
/* calendar: week columns */
.weeknav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.weeknav h2{margin:0;font-size:17px;color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:10px;overflow-x:auto}
.wd{background:var(--surface-2);border-radius:12px;padding:10px;min-height:300px}
.wd h3{font-size:13px;margin:0 0 10px;color:var(--muted);display:flex;justify-content:space-between}
.wd h3 b{font-size:16px;color:var(--ink)}
.wd.today h3 b{color:var(--accent-ink)}
.wd.off{opacity:.55}
.wd .tile{padding:10px}
.wd .tile.pend{border-style:dashed}
/* setup checklist */
.check-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}
.step{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit}
.step:hover{border-color:var(--ink)}
.step[aria-current]{border-color:var(--ink);box-shadow:0 0 0 3px var(--surface-2)}
.step i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;background:var(--surface-2);color:var(--muted)}
.step.done i{background:var(--ok-soft);color:var(--ok)}
.step i svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2}
.step b{display:block;color:var(--ink)}
.step span{font-size:13px;color:var(--muted)}
.progress{display:flex;align-items:center;gap:12px;margin:0 0 18px;font-size:14px;color:var(--muted)}
.progress .meter{flex:0 0 260px;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress .meter i{display:block;height:100%;width:66%;background:var(--ok);border-radius:inherit}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 32px;max-width:980px}
.panel h2{font-size:21px;margin:0 0 4px;color:var(--ink)}
.panel .lede{margin:0 0 22px;color:var(--muted)}
@media (max-width:1100px){.sheet-wrap{grid-template-columns:1fr}.sheet{position:static;max-height:none}.check-grid{grid-template-columns:1fr 1fr}.flow{grid-template-columns:repeat(4,260px)}}
</style></head>
<body>
<script src="data.js"></script>
<script src="shared.js"></script>
<script>
(function(){
var A=AGENT,e=H.esc;
var COLS=[['facts','Needs your facts','var(--warn)','Answer a question to move it on',function(d){return H.needsFacts(d)}],['ready','Ready to review','var(--accent)','Read it, then approve',function(d){return d.status==='draft'&&!d.gaps}],['scheduled','Scheduled','var(--ok)','Publishes on its date',function(d){return d.status==='approved'||d.status==='scheduled'}],['live','Live','var(--ink)','On your store now',function(d){return d.status==='published'}]];
function head(on){
  return '<div class="head">'+H.title()+'<nav class="tabs" aria-label="Agent views">'+[['drafts','Pipeline'],['calendar','Calendar'],['live','Live'],['setup/voice','Setup']].map(function(t){return '<a href="#'+t[0]+'"'+(on===t[0].split('/')[0]?' aria-current="page"':'')+'>'+t[1]+'</a>'}).join('')+'</nav></div>';
}
function tile(d,sel,base){
  var bar=H.needsFacts(d)?'<div class="gapbar" aria-label="'+d.gaps+' facts needed">'+[0,1,2].map(function(i){return '<i class="'+(i<d.gaps?'':'ok')+'"></i>'}).join('')+'</div>':'';
  return '<a class="tile'+(d.status==='draft'&&base==='calendar'?' pend':'')+'" draggable="true" href="#'+(base||'draft')+'/'+d.id+'"'+(d.id===sel?' aria-current="true"':'')+'><div class="top">'+H.img(d)+'<strong>'+e(d.title)+'</strong></div>'+bar+'<div class="meta">'+H.typeTag(d)+'<span>'+(d.planned?H.date(d.planned,{month:'short',day:'numeric'}):'No date')+'</span></div></a>';
}
function board(sel,compact){
  return '<div class="flow'+(compact?' board-mini':'')+'">'+COLS.map(function(c){var items=A.drafts.filter(c[4]);return '<section class="col"><header><i class="dot" style="background:'+c[2]+'"></i><h2>'+c[1]+'</h2><span class="num">'+items.length+'</span></header>'+(compact?'':'<p class="hint">'+c[3]+'</p>')+(items.map(function(d){return tile(d,sel)}).join('')||'<p class="addcol">Nothing here yet</p>')+'</section>'}).join('')+'</div>';
}
function sheet(d){
  var qs=d.open_questions.slice(0,d.gaps),stage=H.needsFacts(d)?0:d.status==='draft'?1:d.status==='published'?3:2;
  var after=d.type==='faq'?d.faqs.map(function(f){return '<h2 style="font-size:15px">'+e(f.q)+'</h2><p>'+e(f.a)+'</p>'}).join(''):'<h2 style="font-size:16px;margin-top:0">'+e(d.new_title||d.title)+'</h2>'+d.html;
  return '<aside class="sheet"><header>'+H.typeTag(d)+'<h2>'+e(d.title)+'</h2><span class="muted" style="font-size:13.5px">'+e(d.product)+' · '+(d.planned?'goes live '+H.date(d.planned)+', 9:00 '+A.store.tz:'no date yet')+'</span><div class="stage">'+['Facts','Review','Scheduled','Live'].map(function(s,i){return '<span class="'+(i===stage?'on':i<stage?'past':'')+'">'+s+'</span>'}).join('')+'</div></header><div class="body">'+
   (qs.length?'<h3 style="margin-top:0">Your answers move this to Ready</h3><div class="facts">'+qs.map(function(q,i){return '<div><label for="s'+i+'">'+e(q)+'</label><input class="input" id="s'+i+'"></div>'}).join('')+'</div>':'')+
   (d.type==='product_fix'?'<h3>Now on your store</h3><div class="before"><b style="color:var(--ink-2)">'+e(d.cur_title)+'</b><br>'+e(d.cur_desc)+'</div>':'')+'<h3>With this draft</h3><div class="doc">'+after+'</div></div>'+
   '<footer><a class="btn ghost" href="#drafts">Close</a><span class="grow"></span><button class="btn">Reject</button>'+(qs.length?'<button class="btn primary">Save answers</button>':'<button class="btn primary">'+H.icon('check')+'Approve</button>')+'</footer></aside>';
}
function pipeline(){return head('drafts')+board()}
function draft(id){var d=H.draft(id);return head('drafts')+'<div class="sheet-wrap">'+board(d.id,true)+sheet(d)+'</div>'}
function calendar(sel){
  var days=[];for(var i=0;i<7;i++)days.push(new Date(2026,9,18+i));
  var d=sel&&H.draft(sel);
  var wk='<div class="week">'+days.map(function(dt){var iso=H.iso(dt),off=A.schedule.days.indexOf((dt.getDay()+6)%7)<0;return '<section class="wd'+(off?' off':'')+(iso===H.today?' today':'')+'"><h3>'+dt.toLocaleDateString('en-US',{weekday:'short'})+'<b>'+dt.getDate()+'</b></h3>'+H.onDay(iso).map(function(x){return tile(x,d&&d.id,'calendar')}).join('')+(off?'<p class="muted" style="font-size:12.5px;margin:0">No publishing</p>':'')+'</section>'}).join('')+'</div>';
  return head('calendar')+'<div class="weeknav"><button class="btn ghost" aria-label="Previous week">'+H.icon('back')+'</button><h2>Oct 18 – 24</h2><button class="btn ghost" aria-label="Next week">'+H.icon('arrow')+'</button><span class="muted" style="margin-left:auto;font-size:13.5px">Drag a card to another day · '+A.store.tz+'</span></div>'+(d?'<div class="sheet-wrap">'+wk+sheet(d)+'</div>':wk);
}
function live(){
  var l=H.byStatus(['published']);
  return head('live')+'<div class="flow" style="grid-template-columns:repeat(3,minmax(250px,1fr))">'+l.map(function(d){return '<a class="tile" href="#draft/'+d.id+'"><div class="top">'+H.img(d)+'<strong>'+e(d.title)+' <span class="example">Example</span></strong></div><div class="meta"><span class="tag ok">Live since '+H.date(d.planned,{month:'short',day:'numeric'})+'</span><span>Too early to read</span></div></a>'}).join('')+'</div>';
}
function setup(step){
  step=step||'voice';
  var blurb={voice:'4 traits confirmed',brand:'Filled from your pages',scope:'Everything allowed',schedule:'3 a week, weekdays 9:00',facts:H.missingTotal+' facts to check',shopify:'Not connected'};
  return head('setup')+'<div class="progress"><div class="meter"><i></i></div>4 of 6 done. The agent starts drafting when you finish missing facts.</div><div class="check-grid">'+H.STEPS.map(function(s,i){return '<a class="step'+(i<4?' done':'')+'" href="#setup/'+s[0]+'"'+(s[0]===step?' aria-current="step"':'')+'><i>'+(i<4?H.icon('check'):i+1)+'</i><div><b>'+s[1]+'</b><span>'+blurb[s[0]]+'</span></div></a>'}).join('')+'</div><section class="panel"><h2>'+H.setupIntro[step][0]+'</h2><p class="lede">'+e(H.setupIntro[step][1])+'</p>'+H.setupBody(step)+'</section>';
}
window.V={name:'Pipeline board',render:function(r){
  if(r[0]==='draft')return draft(r[1]);
  if(r[0]==='calendar')return calendar(r[1]);
  if(r[0]==='live')return live();
  if(r[0]==='setup')return setup(r[1]);
  return pipeline();
}};
})();
</script>
</body></html>
