<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Launch Film Stills</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ec;--ink:#0b1b35;--mute:#6b7280;--line:#e4dfd6;--green:#16a34a}
*{box-sizing:border-box;margin:0}
body{background:#d9d4ca;font-family:Geist,system-ui,sans-serif;color:var(--ink);padding:32px 16px}
h1{font-size:22px;margin:0 auto 6px;max-width:1340px}
.sub{color:#555;font-size:14px;max-width:1340px;margin:0 auto 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;max-width:1340px;margin:auto}
figure{background:#fff;border-radius:14px;padding:12px}
figcaption{font-size:13px;color:#444;padding:10px 4px 2px}
figcaption b{color:var(--ink)}
.frame{aspect-ratio:1;position:relative;overflow:hidden;background:var(--bg);border-radius:8px;container-type:inline-size}
.u{font-size:1cqw}
/* glass */
.glass{background:rgba(255,255,255,.28);backdrop-filter:blur(2px) saturate(1.6);border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(0,0,0,.06),0 8px 30px rgba(11,27,53,.12)}
.cursor{position:absolute;width:3.2cqw;height:3.2cqw}
/* bottles */
.b{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);width:26%;height:66%;border-radius:18% 18% 12% 12%/8% 8% 6% 6%}
.b::before{content:"";position:absolute;left:18%;right:18%;top:-10%;height:12%;border-radius:30% 30% 4% 4%;background:inherit;filter:brightness(.8)}
.b::after{content:"";position:absolute;left:14%;top:8%;width:12%;height:70%;border-radius:40px;background:rgba(255,255,255,.35)}
.tile{position:absolute;border-radius:2.2cqw;overflow:hidden}
.tag{position:absolute;left:6%;bottom:5%;font-size:1.5cqw;font-weight:600;color:var(--ink);opacity:.75}
</style></head><body>
