<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Produkto Launch Film v3</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
:root{--bg:#fafaf8;--ink:#0b1b35;--text:#1a2436;--mute:#586579;--faint:#8b95a5;--line:#e6e7e3;--card:#fff;--blue:#2f80ff;--violet:#7c3aed;--green:#1d9e6b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:var(--bg)}
body{font-family:Geist,system-ui,sans-serif;color:var(--text)}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:var(--bg)}
.L{position:absolute;left:0;top:0;width:100%;height:100%;visibility:hidden}
.L *{visibility:inherit}
.a{position:absolute;left:0;top:0}
.m{position:absolute;overflow:hidden}.m>span{display:block;white-space:nowrap}
img{display:block}
.card{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 1px 2px rgba(11,27,53,.04),0 12px 40px -12px rgba(11,27,53,.12)}
.glow{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}
.grad{background:linear-gradient(90deg,var(--violet),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
#cursor{position:absolute;left:0;top:0;width:44px;height:44px;transform-origin:0 0;z-index:99}
</style></head><body>
<div id="stage">
  <div class="L" id="Lglow" style="visibility:visible"></div>
  <div class="L" id="L1"></div>
  <div class="L" id="Lst"></div>
  <div class="L" id="L2"></div>
  <div class="L" id="L4"></div>
  <div class="L" id="L5"></div>
  <div class="L" id="L6"></div>
  <div class="L" id="L7"></div>
  <div class="L" id="L8"></div>
  <div class="L" id="L9"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2.5l15 10.2-6.6 1.2 3.9 7.3-2.9 1.5-3.9-7.3-4.8 4.6z" fill="#0b1b35" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
</div>
<script>
// ---------- format ----------
const VERT=new URLSearchParams(location.search).get('f')==='v';
const W=VERT?1080:1440, H=VERT?1920:1440, CX=W/2, CY=H/2, PAD=VERT?70:130, CW=W-2*PAD, K=VERT?1.05:1;
document.documentElement.style.cssText=`width:${W}px;height:${H}px`;
const stage=document.getElementById('stage');stage.style.width=W+'px';stage.style.height=H+'px';
const fs=n=>Math.round(n*K)+'px';
// ---------- time (seconds) ----------
const SPD=1.25, DUR=59.99, BPM=132, BT=60/BPM, SH=3.6;   // SPD: whole film plays 25% faster (Kelian 2026-10-20)   // SH: the stat beat pushes everything after the opening back
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eo=p=>1-Math.pow(1-p,3);
const eo5=p=>1-Math.pow(1-p,5);
function S(tau,k=170,z=.78){if(tau<=0)return 0;const w=Math.sqrt(k);
  if(z<1){const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*tau)*(Math.cos(wd*tau)+(z*w/wd)*Math.sin(wd*tau));}
  return 1-Math.exp(-w*tau)*(1+w*tau);}
const E=(t,a,b,f=eio)=>f(clamp((t-a)/(b-a)));
const pop=(t,a,k=200,z=.72)=>Math.max(0,S(t-a,k,z));
const on=(t,a,b)=>t>=a&&t<b;
const $=id=>document.getElementById(id);
const box=(el,x,y,w,h,r)=>{el.style.left=x+'px';el.style.top=y+'px';if(w!=null)el.style.width=Math.max(0,w)+'px';if(h!=null)el.style.height=Math.max(0,h)+'px';if(r!=null)el.style.borderRadius=r+'px';};
const vis=(el,v)=>{const e=typeof el==='string'?$(el):el;e.style.visibility=v?(e.classList.contains('L')||e.id==='cursor'?'visible':'inherit'):'hidden';};
const tf=(el,s)=>{el.style.transform=s;};
function mk(par,html,css='',cls='a'){const d=document.createElement('div');d.className=cls;d.innerHTML=html;d.style.cssText+=css;(typeof par==='string'?$(par):par).appendChild(d);return d;}
// word that rises out of its own line, with a soft blur-free fade in the motion only
const rise=(el,p)=>{el.firstElementChild.style.transform=`translateY(${(1-p)*(el.clientHeight+12)}px)`;};  // always clears the whole mask
const A='assets/v3/';
const LOGO={openai:'logo-openai.svg',google:'logo-google.svg',perplexity:'logo-perplexity.svg',gemini:'logo-gemini.svg',copilot:'logo-copilot.svg',claude:'logo-claude.svg'};

// ---------- SFX cue sheet (seconds) ----------
const SFX=[];const cue=(t,n,v=1)=>SFX.push([t>=4.3?t+SH:t,n,v]);
window.SFX=SFX;window.DUR=DUR;window.BPM=BPM;  // SFX times are scaled by SPD in seek's caller below

// ---------- ambient glows (always on, drift slowly) ----------
const G1=mk('Lglow','','background:rgba(47,128,255,.16)','glow'), G2=mk('Lglow','','background:rgba(124,58,237,.12)','glow');
function glows(t,mood){ // mood 0 calm white, 1 stronger
  t=REAL;const r=VERT?700:760;box(G1,CX-r/2+Math.sin(t*.25)*120-200,CY-r/2+Math.cos(t*.2)*90-120,r,r);
  box(G2,CX-r/2+Math.cos(t*.22)*140+220,CY-r/2+Math.sin(t*.18)*100+160,r*.9,r*.9);
  G1.style.opacity=.6+.4*mood;G2.style.opacity=.5+.5*mood;}

// =====================================================================
// S1 (0-4.6s): "In today's [ChatGPT] world," / "shoppers ask AI what to buy."
// =====================================================================
const s1fs=VERT?84:92;
const s1a=mk('L1','',`left:0;width:${W}px;top:${CY-s1fs*1.1}px;display:flex;justify-content:center;align-items:center;gap:${s1fs*.28}px;font:600 ${s1fs}px Geist;letter-spacing:-.02em;color:var(--ink)`);
const W1=['In','today’s','@','world,'].map(w=>w==='@'
  ?mk(s1a,`<img src="${A}logo-openai.svg" style="width:${s1fs*.95}px;height:${s1fs*.95}px">`,`position:relative;width:${s1fs}px;height:${s1fs*1.2}px;display:flex;align-items:center;justify-content:center`,'')
  :mk(s1a,`<span>${w}</span>`,`position:relative;height:${s1fs*1.25}px;overflow:hidden`,'m'));
const s1b=mk('L1',`<span>shoppers ask AI what to buy.</span>`,`left:0;width:${W}px;text-align:center;top:${CY+s1fs*.25}px;height:${s1fs*1.3}px;font:500 ${Math.round(s1fs*.62)}px Geist;color:var(--mute)`,'m');
function sc1(t){const show=t<4.9;vis('L1',show);if(!show)return;
  W1.forEach((w,i)=>{const p=E(t,.25+i*.22,.95+i*.22,eo5);
    if(i===2){const s=pop(t,.7,220,.6);tf(w,`scale(${s}) rotate(${(1-Math.min(1,s))*-90+t*0}deg)`);}else rise(w,p);});
  rise(s1b,E(t,1.7,2.4,eo5));
  const out=E(t,4.1,4.7,eio);s1a.style.transform=`translateY(${-out*60}px)`;s1a.style.opacity=1-out;s1b.style.opacity=1-out;s1b.style.transform=`translateY(${-out*60}px)`;}
cue(.7,'pop',.5);

// =====================================================================
// STAT (real time 4.5-8.2s): NielsenIQ, 24 Sep 2026
// =====================================================================
const stN=mk('Lst',`<span class="grad">0%</span>`,`left:0;width:${W}px;text-align:center;top:${CY-(VERT?250:240)}px;height:${VERT?220:240}px;font:700 ${VERT?200:230}px Geist;letter-spacing:-.05em;line-height:1.05`,'m');
const stL=mk('Lst',`<span>of U.S. consumers have used AI</span><span>to help them shop</span>`,`left:0;width:${W}px;text-align:center;top:${CY+(VERT?10:20)}px;height:${VERT?130:140}px;font:600 ${fs(VERT?44:54)} Geist;color:var(--ink);letter-spacing:-.02em;line-height:1.22`,'m');
const stS=mk('Lst',`<span>Source: NielsenIQ, September 2026</span>`,`left:0;width:${W}px;text-align:center;top:${CY+(VERT?180:200)}px;height:40px;line-height:40px;font:500 ${fs(22)} Geist;color:var(--faint)`,'m');
function scStat(t){const show=on(t,4.4,7.9);vis('Lst',show);if(!show)return;
  rise(stN,E(t,4.75,5.35,eo5));stN.firstElementChild.textContent=Math.round(51*E(t,4.85,6.0,eo))+'%';
  [...stL.children].forEach((c,i)=>{c.style.transform=`translateY(${(1-E(t,5.25+i*.15,5.95+i*.15,eo5))*240}%)`;});
  rise(stS,E(t,6.0,6.6,eo5));
  const out=E(t,7.3,7.85,eio);document.getElementById('Lst').style.opacity=1-out;document.getElementById('Lst').style.transform=`translateY(${-out*50}px)`;}

// =====================================================================
// S2+S3 (4.4-14.4s): search box, typed question, the real answer
// =====================================================================
const Q='What are the best dog leashes for my dog golden retriever?';
const sbW=VERT?CW:Math.min(1060,CW), sbH=VERT?150:104;
const sbGlow=mk('L2','','background:radial-gradient(closest-side,rgba(47,128,255,.28),rgba(124,58,237,.12),transparent)','glow');
const sb=mk('L2','',`background:#fff;border:1px solid var(--line);box-shadow:0 18px 50px -18px rgba(47,128,255,.35)`);
const sbTxt=mk(sb,'',`left:${VERT?34:40}px;top:0;right:${sbH}px;height:100%;display:flex;align-items:center;font:500 ${fs(VERT?34:34)} Geist;color:var(--text);line-height:1.25;white-space:${VERT?'normal':'nowrap'}`);
const sbCaret=mk(sb,'',`width:3px;background:var(--blue);border-radius:2px`);
const sbSend=mk(sb,`<svg viewBox="0 0 24 24" width="55%" height="55%"><path d="M12 19V5M5 12l7-7 7 7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,`border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center`);
// answer panel
const ap=mk('L2','',`overflow:hidden`,'card');
const apW=VERT?CW:Math.min(1060,CW);
const apHead=mk(ap,`<img src="${A}logo-openai.svg" style="width:34px;height:34px"><span style="font:600 ${fs(26)} Geist;color:var(--ink)">ChatGPT</span>`,`left:36px;top:30px;display:flex;align-items:center;gap:14px`);
const apIntro=mk(ap,`For a <b>Golden Retriever</b>, I would choose a leash that is strong, comfortable to hold, and preferably <b>1.5–2 metres long</b>.`,`left:36px;right:36px;top:${VERT?92:88}px;font:400 ${fs(VERT?27:25)} Geist;line-height:1.45;color:var(--text)`);
const apTitle=mk(ap,`My top 5 dog leashes`,`left:36px;top:${VERT?230:178}px;font:600 ${fs(VERT?31:28)} Geist;color:var(--ink)`);
const ROWS=[
 ['rw-frontrange-riverrock.png','Ruffwear – Front Range Dog Leash With Padded Handle','Everyday walking · Padded handle','€26.95','Best overall'],
 ['rw-crag-risingwave.png','Ruffwear Crag Dog Leash Everyday Lead','Best premium versatile leash','€40.95',''],
 ['halti-anatomy-grey.jpg','Correa Multifuncional para Perros Halti Anatomía','Best for training and pulling','€34.99',''],
 ['rw-knot-black.png','ruffwear Correa de cuerda Knot a Leash','Best strong rope leash','€44.95',''],
 ['ns-touring-bungee-teal.jpg','Non-stop dogwear Touring Bungee','Best for hiking and active walks','',''],
];
const rowH=VERT?165:128, rowTop=VERT?300:236, thumb=rowH-26;
const RW=ROWS.map((r,i)=>mk(ap,`
 <div class="a" style="left:0;top:13px;width:${thumb}px;height:${thumb}px;border-radius:16px;background:#f3f3f1;overflow:hidden"><img src="${A+r[0]}" style="width:100%;height:100%;object-fit:contain;padding:8%"></div>
 <div class="a" style="left:${thumb+24}px;top:0;right:0;height:100%;display:flex;flex-direction:column;justify-content:center;gap:5px">
  ${r[4]?`<span style="align-self:flex-start;font:600 ${fs(17)} Geist;color:#15803d;background:#dcfce7;border-radius:999px;padding:3px 11px">${r[4]}</span>`:''}
  <div style="font:600 ${fs(VERT?25:23)} Geist;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:underline;text-decoration-color:#c9ced6;text-underline-offset:4px">${r[1]}</div>
  <div style="font:400 ${fs(18)} Geist;color:var(--mute)">${r[2]}</div>
  ${r[3]?`<div style="font:600 ${fs(21)} Geist;color:var(--text)">${r[3]}</div>`:''}</div>`,`left:36px;right:36px;height:${rowH}px;border-top:1px solid var(--line)`));
// the merchant that isn't there
const miss=mk('L2',`
 <div class="a" style="left:18px;top:16px;width:${thumb}px;height:${thumb}px;border-radius:16px;background:#f3f3f1;overflow:hidden"><img src="${A}wo-lightweight-limeade.jpg" style="width:100%;height:100%;object-fit:cover;filter:grayscale(1);opacity:.55"></div>
 <div class="a" style="left:${thumb+42}px;top:0;right:20px;height:100%;display:flex;flex-direction:column;justify-content:center;gap:8px">
  <div style="font:600 ${fs(VERT?25:23)} Geist;color:#9aa3b2">Wild One Lightweight Dog Leash</div>
  <span style="align-self:flex-start;font:600 ${fs(18)} Geist;color:#b93c0a;background:#fff2ea;border:1px solid #f8cdb5;border-radius:999px;padding:4px 12px">Not in the answer</span></div>`,
 `border:1.5px dashed #c9ced6;background:rgba(255,255,255,.85)`,'card');
function sc2(t){const show=on(t,4.3,14.6);vis('L2',show);if(!show)return;
  // search box: rises in, types, then slides up and becomes the header of the answer
  const pin=E(t,4.4,5.2,eo5), up=E(t,7.9,8.7,eio);
  const yMid=CY-sbH/2, yTop=VERT?150:90;
  const sy=lerp(yMid+60*(1-pin),yTop,up);
  box(sb,CX-sbW/2,sy,sbW,sbH,sbH/2);sb.style.opacity=pin;
  box(sbGlow,CX-sbW*.6,sy-sbH*1.6,sbW*1.2,sbH*4.2);sbGlow.style.opacity=pin*(1-up*.7);
  box(sbSend,sbW-sbH*.78,sbH*.14,sbH*.64,sbH*.64,null);
  const n=Math.floor(Q.length*E(t,5.3,7.3,x=>x));sbTxt.textContent=n?Q.slice(0,n):'Ask anything';sbTxt.style.color=n?'var(--text)':'var(--faint)';
  const blink=(Math.floor(t*2.4)%2===0)||(t>5.3&&t<7.3);vis(sbCaret,blink&&t<7.6&&!VERT);box(sbCaret,40+Math.min(sbW-sbH-60,sbTxt.scrollWidth)+4,sbH*.3,3,sbH*.4);
  tf(sbSend,`scale(${t>7.45&&t<7.6?.86:1})`);
  // answer panel
  const apY=yTop+sbH+28, apH=VERT?H-apY-110:H-apY-70;
  const ap_in=E(t,8.5,9.3,eo5);
  box(ap,CX-apW/2,apY+40*(1-ap_in),apW,apH);ap.style.opacity=ap_in;
  apIntro.style.opacity=E(t,8.9,9.5);apTitle.style.opacity=E(t,9.3,9.8);
  RW.forEach((r,i)=>{const p=E(t,9.6+i*.32,10.3+i*.32,eo5);r.style.top=(rowTop+i*rowH+20*(1-p))+'px';r.style.opacity=p;});
  // camera: gentle push in on the list, then the missing card slides in beside/below
  const push=E(t,11.6,13.2,eio);const s=1+push*(VERT?.04:.06);tf(ap,`scale(${s})`);ap.style.transformOrigin='50% 30%';
  const mp=E(t,12.4,13.2,eo5), mW=VERT?CW-40:apW*.72, mH=thumb+32;
  box(miss,CX-mW/2,H-(VERT?300:250)+(1-mp)*120,mW,mH);miss.style.opacity=mp;
  const out=E(t,13.9,14.5,eio);[sb,ap,miss].forEach(e=>{e.style.filter=`blur(${out*8}px)`;});
  document.getElementById('L2').style.opacity=1-out;}
cue(4.4,'swoosh',.35);for(let i=0;i<24;i++)cue(5.3+i*2/24,'key',.22);cue(7.5,'click',.7);[9.6,9.92,10.24,10.56,10.88].forEach(x=>cue(x,'pop',.32));cue(12.4,'swoosh',.4);

// =====================================================================
// S4 (14.2-18.4s): blue gradient, agent name, P spins in 3D, wordmark
// =====================================================================
const s4bg=mk('L4','',`left:0;top:0;width:${W}px;height:${H}px;background:radial-gradient(120% 90% at 50% 110%,#c9dcff 0%,#4f8dff 38%,#1f5fe0 70%,#0b1b35 115%)`);
const s4lbl=mk('L4',`<span style="display:flex;align-items:center;justify-content:center;gap:22px"><svg viewBox="0 0 20 20" width="${VERT?40:46}" height="${VERT?40:46}" style="overflow:visible"><path id="sp1" d="M8 2.5l1.5 4.2 4.2 1.5-4.2 1.5L8 13.9 6.5 9.7 2.3 8.2l4.2-1.5z" fill="#fff"/><path id="sp2" d="M15 11.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z" fill="#fff"/></svg>Catalog Optimization Agent</span>`,
  `left:0;width:${W}px;top:${CY+(VERT?80:120)}px;height:80px;font:600 ${fs(VERT?40:46)} Geist;color:#fff;letter-spacing:-.01em;text-align:center`,'m');
// 3D P: stacked layers give it thickness while it spins
const P3=mk('L4','',`left:${CX}px;top:${CY-(VERT?40:30)}px;width:0;height:0;perspective:1400px`);
const P3in=mk(P3,'',`left:0;top:0;transform-style:preserve-3d`);
const PSZ=VERT?155:190, PLAY=14;
const PL=[...Array(PLAY)].map((_,i)=>mk(P3in,i<PLAY-1?`<div style="width:${PSZ}px;height:${PSZ*486/480}px;border-radius:${PSZ*.22}px;background:#07142a"></div>`:`<img src="${A}produkto-mark-rounded.png" style="width:${PSZ}px;height:${PSZ*486/480}px;backface-visibility:hidden">`,`left:${-PSZ/2}px;top:${-PSZ/2}px;transform:translateZ(${(i-PLAY+1)*1.6}px)`));
const s4in=mk('L4',`<span>Introducing</span>`,`left:0;width:${W}px;text-align:center;top:${CY-(VERT?250:280)}px;height:${VERT?90:100}px;font:600 ${fs(VERT?64:76)} Geist;color:#fff;letter-spacing:-.02em`,'m');
const LK_I=VERT?155:190, LK_TH=Math.round(LK_I*.54), LK_TW=Math.round(LK_TH*509/64), LK_G=Math.round(LK_I*.2);
const LK_W=LK_I+LK_G+LK_TW, LK_X=CX-LK_W/2, LK_Y=CY-(VERT?40:30);
const s4wm=mk('L4',`<img src="${A}produkto-text-light.png" style="width:${LK_TW}px;height:${LK_TH}px">`,`left:${LK_X+LK_I+LK_G}px;top:${LK_Y-LK_TH/2}px;width:${LK_TW}px;height:${LK_TH}px;overflow:hidden`);
function sc4(t){const show=on(t,14.2,18.6);vis('L4',show);if(!show)return;
  const wipe=E(t,14.2,14.9,eio);s4bg.style.clipPath=`circle(${wipe*Math.hypot(W,H)*1.05}px at 50% 100%)`;
  rise(s4in,E(t,14.6,15.2,eo5));
  // P spins alone in the centre, then slides left as PRODUKTO wipes in beside it
  const slide=E(t,16.5,17.2,eio);
  P3.style.left=lerp(CX,LK_X+LK_I/2,slide)+'px';
  // PRODUKTO slides out from behind the P: hidden left of the P's right edge, travelling with it
  const pRight=lerp(CX,LK_X+LK_I/2,slide)+LK_I/2, mL=LK_X+LK_I+LK_G;
  const out_=E(t,16.55,17.35,eio);
  const tx=lerp(pRight-mL-LK_TW,0,out_);
  s4wm.firstElementChild.style.transform=`translateX(${tx}px)`;
  s4wm.style.clipPath=`inset(0 0 0 ${Math.max(0,pRight-mL+4)}px)`;s4wm.style.overflow='visible';
  const lp=E(t,17.3,17.9,eo5), lo=0;rise(s4lbl,lp*(1-lo));
  ['sp1','sp2'].forEach((id,i)=>{$(id).style.transformOrigin=i?'15px 14.3px':'8px 8.2px';$(id).style.transform=`scale(${.8+.2*Math.cos((t-14)*4+i*2)})`;});
  // P: pops in, spins one full turn and a bit on Y with a little X tilt, settles
  const pp=pop(t,15.2,180,.7), spin=E(t,15.2,16.8,eo5);
  vis(P3,t>15.15);tf(P3in,`scale(${pp})`);  // no spin: Kelian 2026-10-20, a flat pop reads cleaner
  const out=E(t,18.1,18.6,eio);document.getElementById('L4').style.opacity=1-out;}
cue(14.2,'zoom',.5);cue(16.5,'swoosh',.45);

// =====================================================================
// S5 (18.4-21.6s): "Hundreds of thousands of data points"
// =====================================================================
const s5t=mk('L5',`<span class="grad">Hundreds of thousands</span>`,`left:0;width:${W}px;text-align:center;top:${CY-(VERT?120:110)}px;height:${VERT?110:120}px;font:700 ${fs(VERT?70:96)} Geist;letter-spacing:-.03em`,'m');
const s5s=mk('L5',`<span>of data points on what AI recommends</span>`,`left:0;width:${W}px;text-align:center;top:${CY+(VERT?10:20)}px;height:70px;font:500 ${fs(VERT?36:42)} Geist;color:var(--ink)`,'m');
const NET=[...Array(VERT?26:30)].map((_,i)=>{const r=(i*9301+49297)%233280/233280, r2=(i*4253+1173)%7919/7919;
  return {x:r*W, y:r2*H, s:[10,14,18][i%3], c:['#2f80ff','#a9c6ff','#0b1b35'][i%3], d:.12*i%1.4};});
const netSvg=mk('L5',`<svg width="${W}" height="${H}" id="netSvg"></svg>`,`left:0;top:0`);
