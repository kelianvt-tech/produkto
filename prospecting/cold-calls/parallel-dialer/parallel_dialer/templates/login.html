<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign in · {{ brand }}</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/login.css">
</head>
<body>
<main class="login">
  <p class="kicker">{{ brand }} dialer</p>
  <h1>Sign in</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email
      <input type="email" name="email" value="{{ email }}" autocomplete="username" required autofocus>
    </label>
    <label>Access key
      <input type="password" name="key" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
  <p class="hint">Whoever runs this server gets your access key with <code>python -m parallel_dialer access-key you@example.com</code>.</p>
</main>
</body>
</html>
