[project]
name = "parallel-dialer"
version = "1.0.0"
description = "A parallel power dialer: Twilio places the calls, Close CRM supplies the contacts, and whoever picks up is put through to a waiting operator."
requires-python = ">=3.12"
# The ranges this engine has been run and tested against.
dependencies = [
  "fastapi>=0.141,<1",
  "starlette>=1.6,<2",
  "uvicorn>=0.52,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.13,<3",
  "PyJWT>=2.13,<3",
  "python-multipart>=0.0.32,<0.1",
  "jinja2>=3.1,<4",
  # The engine resolves contact timezones with zoneinfo; Linux ships the IANA data,
  # Windows does not, so a developer machine needs it as a package.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
parallel-dialer = "parallel_dialer.__main__:main"

[tool.setuptools]
packages = ["parallel_dialer"]

[tool.setuptools.package-data]
parallel_dialer = ["templates/*", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
